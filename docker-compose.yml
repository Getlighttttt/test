services:
  db1:
    image: postgres:16
    container_name: wms-db1
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms123
      POSTGRES_DB: wms_operational
    ports:
      - "5433:5432"
    volumes:
      - db1data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d wms_operational"]
      interval: 5s
      timeout: 5s
      retries: 10

  db2:
    image: postgres:16
    container_name: wms-db2
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms123
      POSTGRES_DB: wms_analytics
    ports:
      - "5434:5432"
    volumes:
      - db2data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d wms_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-app
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Db1: "Host=db1;Port=5432;Database=wms_operational;Username=wms;Password=wms123"
      ConnectionStrings__Db2: "Host=db2;Port=5432;Database=wms_analytics;Username=wms;Password=wms123"
    depends_on:
      db1:
        condition: service_healthy
      db2:
        condition: service_healthy

volumes:
  db1data:
  db2data:
