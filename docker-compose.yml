services:
  db1:
    image: postgres:16
    container_name: wms-db1
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms123
      POSTGRES_DB: wms_operational
    ports:
      - "5433:5432"
    volumes:
      - db1data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d wms_operational"]
      interval: 5s
      timeout: 5s
      retries: 10

  db2:
    image: postgres:16
    container_name: wms-db2
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms123
      POSTGRES_DB: wms_analytics
    ports:
      - "5434:5432"
    volumes:
      - db2data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d wms_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-app
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ML_SERVICE_URL: "http://ml-service:8000"  # Reserved for future ASP.NET integration. Not used yet.
      ConnectionStrings__Db1: "Host=db1;Port=5432;Database=wms_operational;Username=wms;Password=wms123"
      ConnectionStrings__Db2: "Host=db2;Port=5432;Database=wms_analytics;Username=wms;Password=wms123"
    depends_on:
      db1:
        condition: service_healthy
      db2:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: wms-ml
    ports:
      - "127.0.0.1:8001:8000"  # Local testing only; internal container port is 8000.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db1data:
  db2data:
